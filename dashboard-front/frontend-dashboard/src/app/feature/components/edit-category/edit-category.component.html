<div class="edit-category-container">
  <div class="page-header">
    <div>
      <h1>Edit Category</h1>
      <p>Update category information</p>
    </div>

    <button type="button" class="back-button" routerLink="/categories">
      Back to Categories
    </button>
  </div>

  <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>

  <form class="category-form" (ngSubmit)="updateCategory()">
    <div class="form-group">
      <label for="category-en"> Category Name - English </label>

      <input
        id="category-en"
        type="text"
        name="category-en"
        [(ngModel)]="category.category.en"
        placeholder="Enter category name in English"
      />
    </div>

    <div class="form-group">
      <label for="category-ar"> Category Name - Arabic </label>

      <input
        id="category-ar"
        type="text"
        name="category-ar"
        [(ngModel)]="category.category.ar"
        placeholder="Enter category name in Arabic"
        dir="rtl"
      />
    </div>

    <div class="form-group">
      <label for="description-en"> Description - English </label>

      <textarea
        id="description-en"
        name="description-en"
        [(ngModel)]="category.description.en"
        placeholder="Enter description in English"
        rows="5"
      ></textarea>
    </div>

    <div class="form-group">
      <label for="description-ar"> Description - Arabic </label>

      <textarea
        id="description-ar"
        name="description-ar"
        [(ngModel)]="category.description.ar"
        placeholder="Enter description in Arabic"
        dir="rtl"
        rows="5"
      ></textarea>
    </div>

    <div class="form-actions">
      <button type="button" class="cancel-button" routerLink="/categories">
        Cancel
      </button>

      <button type="submit" class="submit-button">submit</button>
    </div>
  </form>
</div>
