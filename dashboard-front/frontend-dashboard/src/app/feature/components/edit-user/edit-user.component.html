<div class="edit-user-container">
  <div class="edit-user-card">
    <h2>Edit User</h2>

    <div class="form-group">
      <label for="name"> Name </label>

      <input
        id="name"
        type="text"
        name="name"
        [(ngModel)]="user.name"
        placeholder="Enter user name"
      />
    </div>

    <div class="form-group">
      <label for="email"> Email </label>

      <input
        id="email"
        type="email"
        name="email"
        [(ngModel)]="user.email"
        placeholder="Enter email"
      />
    </div>

    <div class="form-group">
      <label for="password"> Password </label>

      <input
        id="password"
        type="password"
        name="password"
        [(ngModel)]="user.password"
        placeholder="Leave empty to keep current password"
      />
    </div>

    <div class="form-group">
      <label for="type"> Type </label>

      <select id="type" name="type" [(ngModel)]="user.type">
        <option value="" disabled>Select user type</option>

        <option value="admin">Admin</option>

        <option value="sales">product manager</option>

        <option value="customer">Customer</option>
      </select>
    </div>

    <div class="form-group">
      <label for="status"> Status </label>

      <select id="status" name="status" [(ngModel)]="user.status">
        <option value="" disabled>Select user status</option>

        <option value="active">Active</option>

        <option value="inactive">Inactive</option>
      </select>
    </div>

    <div class="form-group">
      <label for="role"> Role </label>

      <select
        id="role"
        name="role"
        [(ngModel)]="user.role"
        [disabled]="loadingRoles"
      >
        <option value="">Select user role</option>

        <option *ngFor="let role of roles" [value]="role.name">
          {{ role.name }}
        </option>
      </select>

      <small *ngIf="loadingRoles"> Loading roles... </small>
    </div>

    <div class="button-group">
      <button type="button" (click)="updateUser()" [disabled]="loadingRoles">
        Update User
      </button>

      <button type="button" routerLink="/users">Cancel</button>
    </div>
  </div>
</div>
