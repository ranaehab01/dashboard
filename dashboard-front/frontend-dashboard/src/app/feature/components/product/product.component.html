<div class="products-container">
  <div class="page-header">
    <div>
      <h1>Products</h1>
    </div>

    <!-- Only users with create products permission -->
    <button
      *ngIf="can('create products')"
      class="add-button"
      type="button"
      routerLink="/add-product"
    >
      Add Product
    </button>
  </div>

  <!-- Error -->
  <div class="error" *ngIf="errorMessage">
    {{ errorMessage }}
  </div>

  <!-- Products table -->
  <table *ngIf="products.length > 0">
    <thead>
      <tr>
        <th>Image</th>
        <th>Product</th>
        <th>Category</th>
        <th>Price</th>
        <th>Stock</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let product of products">
        <!-- Image -->
        <td>
          <img
            *ngIf="product.image"
            [src]="product.image"
            [alt]="product.name"
            width="50"
            height="50"
          />

          <span *ngIf="!product.image"> No image </span>
        </td>

        <td>
          {{ product.name }}
        </td>

        <td>
          {{ product.category?.name?.en || "No category" }}
        </td>

        <td>
          {{ product.price }}
        </td>

        <td>
          {{ product.stock }}
        </td>

        <td>
          {{ product.status }}
        </td>

        <td class="actions">
          <button
            *ngIf="can('view products')"
            type="button"
            class="action-btn view-btn"
            (click)="viewProduct(product.id)"
          >
            View
          </button>

          <button
            *ngIf="can('update products')"
            type="button"
            class="action-btn edit-btn"
            [routerLink]="['/edit', product.id]"
          >
            Edit
          </button>

          <button
            *ngIf="can('delete products')"
            type="button"
            class="action-btn delete-btn"
            (click)="deleteProduct(product.id)"
          >
            Delete
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="products.length === 0 && !errorMessage">No products found.</div>
</div>
